name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@appspine"

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Catches a version hand-edited in a package's package.json without a matching
      # CHANGELOG.md entry — i.e. bypassing `changeset version` / the changesets/action
      # release PR. See scripts/check-changeset-discipline.mjs for why this exists.
      - run: node scripts/check-changeset-discipline.mjs origin/main
        if: github.event_name == 'pull_request'
      - run: node scripts/check-changeset-discipline.mjs HEAD^
        if: github.event_name == 'push'

      # Always build/typecheck/test the full workspace (all 13 packages, ~90s), not a
      # pnpm --filter "...[ref]"-scoped subset. That filter's "include dependencies of
      # changed packages" walk does not pick up workspace deps declared only in
      # devDependencies (our peerDependencies + devDependencies pattern for e.g.
      # @appspine/common, see Z05-template-common-singleton-override.md) — so a changed
      # package could build before its unbuilt dependency, racing on dist/*.d.ts and
      # failing with "Cannot find module". Confirmed working full-workspace below;
      # don't reintroduce a --filter shortcut without re-verifying that gap is closed.
      # build must run before typecheck/test: each package's tsc resolves workspace
      # deps via their built dist/*.d.ts, not TS project references, so a fresh
      # checkout with no dist/ yet fails typecheck on any cross-package import.
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run test

      - name: Lint knowledge base
        run: node scripts/lint-knowledge.js