openapi: 3.1.0
info: { title: Approve document change status, version: 1.0.0 }
paths:
  /integration/knowledge-document-change-requests/{changeRequestId}:
    get:
      operationId: getKnowledgeDocumentChangeRequestStatus
      parameters:
        - in: path
          name: changeRequestId
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200': { description: Status, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
        '404': { description: Not found or not visible }
components:
  schemas:
    StatusResponse:
      type: object
      required: [changeRequestId, status, requestId]
      properties:
        changeRequestId: { type: string }
        status: { enum: [SUBMISSION_PENDING, CONFIRMED, FAILED] }
        requestId: { type: string }
        revision: { type: integer, minimum: 0 }
        reasonCode: { type: string }
