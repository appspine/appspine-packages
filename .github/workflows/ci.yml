name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Catches a version hand-edited in a package's package.json without a matching
      # CHANGELOG.md entry — i.e. bypassing `changeset version` / the changesets/action
      # release PR. See scripts/check-changeset-discipline.mjs for why this exists.
      - run: node scripts/check-changeset-discipline.mjs origin/main
        if: github.event_name == 'pull_request'
      - run: node scripts/check-changeset-discipline.mjs HEAD^
        if: github.event_name == 'push'

      # pnpm's --filter "...[ref]" selects packages changed since main PLUS their
      # dependencies (so a changed package's deps are available to build/typecheck
      # against), skipping unrelated @appspine/* packages. build must run before
      # typecheck/test: each package's tsc resolves workspace deps via their built
      # dist/*.d.ts, not TS project references, so a fresh checkout with no dist/
      # yet fails typecheck on any cross-package import otherwise.
      - run: pnpm --filter "...[origin/main]" run build
        if: github.event_name == 'pull_request'
      - run: pnpm --filter "...[origin/main]" run typecheck
        if: github.event_name == 'pull_request'
      - run: pnpm --filter "...[origin/main]" run test
        if: github.event_name == 'pull_request'

      - run: pnpm run build
        if: github.event_name == 'push'
      - run: pnpm run typecheck
        if: github.event_name == 'push'
      - run: pnpm run test
        if: github.event_name == 'push'
