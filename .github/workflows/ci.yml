name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@appspine"

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Catches a version hand-edited in a package's package.json without a matching
      # CHANGELOG.md entry — i.e. bypassing `changeset version` / the changesets/action
      # release PR. See scripts/check-changeset-discipline.mjs for why this exists.
      - run: node scripts/check-changeset-discipline.mjs origin/main
        if: github.event_name == 'pull_request'
      - run: node scripts/check-changeset-discipline.mjs HEAD^
        if: github.event_name == 'push'

      # Always build/typecheck/test the full workspace (all 20 packages, ~90s), not a
      # pnpm --filter "...[ref]"-scoped subset. That filter's "include dependencies of
      # changed packages" walk does not pick up workspace deps declared only in
      # devDependencies (our peerDependencies + devDependencies pattern for e.g.
      # @appspine/common, see Z05-template-common-singleton-override.md) — so a changed
      # package could build before its unbuilt dependency, racing on dist/*.d.ts and
      # failing with "Cannot find module". Confirmed working full-workspace below;
      # don't reintroduce a --filter shortcut without re-verifying that gap is closed.
      # build must run before typecheck/test: each package's tsc resolves workspace
      # deps via their built dist/*.d.ts, not TS project references, so a fresh
      # checkout with no dist/ yet fails typecheck on any cross-package import.
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run test

      # PL0-07 (051-plugin-platform-engineering-task-breakdown.md): the TypeScript project
      # references graph must independently build a fresh checkout (no committed dist/) in
      # correct dependency order. This does not replace the pnpm -r build/typecheck/test
      # above — it is a second, TS-native path that will let PL1-07's architecture checker
      # (and later affected-package incremental builds) trust `tsc -b` as ground truth.
      - name: Verify TypeScript project-references build graph (clean)
        run: |
          pnpm exec tsc -b tsconfig.json --clean
          pnpm exec tsc -b tsconfig.json
      - name: Verify Phase 0 frozen contracts and build graph
        run: pnpm run verify:phase0

      - name: Verify Phase 1 architecture and Node 22 tarball consumer
        run: pnpm run verify:phase1

      # PL2-10: the generation gate compares every generated artefact against a committed golden,
      # regenerates in a second directory to prove determinism means "same inputs" rather than
      # "same run", hands the composed schema to Prisma, and — with --self-test — breaks each
      # artefact in turn to prove it would notice. A drift check nobody has watched fail is a
      # drift check nobody knows works.
      - name: Verify Phase 2 deterministic generation
        run: pnpm run verify:phase2

      # Uploaded on failure only: a generation diff is unreadable in a log and obvious as a file.
      - name: Upload generation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appspine-generation-diagnostics
          path: |
            fixtures/051-pl2-generation/golden/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Lint knowledge base
        run: node scripts/lint-knowledge.js
