openapi: 3.1.0
info:
  title: Approve document change submission
  version: 1.0.0
paths:
  /integration/knowledge-document-change-requests:
    post:
      operationId: submitKnowledgeDocumentChange
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitRequest' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SubmitResponse' } } } }
        '200': { description: Replay, content: { application/json: { schema: { $ref: '#/components/schemas/SubmitResponse' } } } }
        '409': { description: Idempotency conflict }
        '422': { description: Invalid request }
components:
  schemas:
    SubmitRequest:
      type: object
      additionalProperties: false
      required: [documentId, baseRevision, proposedRevision, contentChecksum, ownerDepartment, summary, actor]
      properties:
        documentId: { type: string, minLength: 1, maxLength: 200 }
        baseRevision: { type: integer, minimum: 0 }
        proposedRevision: { type: integer, minimum: 1 }
        contentChecksum: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        ownerDepartment: { type: string, minLength: 1, maxLength: 100 }
        summary: { type: string, minLength: 1, maxLength: 500 }
        actor:
          type: object
          additionalProperties: false
          required: [userId]
          properties:
            userId: { type: string, minLength: 1 }
            displayName: { type: string, maxLength: 200, x-appspine-data-classification: PERSONAL }
    SubmitResponse:
      type: object
      additionalProperties: false
      required: [changeRequestId, status, requestId]
      properties:
        changeRequestId: { type: string, minLength: 1 }
        status: { enum: [SUBMISSION_PENDING, CONFIRMED] }
        requestId: { type: string, minLength: 1 }
